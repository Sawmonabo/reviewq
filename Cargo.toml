[workspace]
members = [
    "crates/reviewq-domain",
    "crates/reviewq-protocol",
    "crates/reviewq-app",
    "crates/reviewq-store",
    "crates/reviewq-providers",
    "crates/reviewq-transport",
    "crates/reviewq",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
