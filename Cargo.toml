[workspace]
members = ["crates/domain", "crates/protocol", "crates/app", "crates/store", "crates/providers", "crates/transport", "crates/reviewq"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
