[package]
name = "reviewq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4.3"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["service", "tokio"] }
notify = { version = "=8.2.2", default-features = false }
reqwest = { version = "=0.13.5", default-features = false }
reviewq-app = { path = "../reviewq-app" }
reviewq-domain = { path = "../reviewq-domain" }
reviewq-protocol = { path = "../reviewq-protocol" }
reviewq-providers = { path = "../reviewq-providers" }
reviewq-store = { path = "../reviewq-store" }
reviewq-transport = { path = "../reviewq-transport" }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6"
tempfile = "3.27"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "=0.25.19"
uuid = { version = "1.24", default-features = false, features = ["v4"] }

[lints]
workspace = true
