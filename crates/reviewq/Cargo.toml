[package]
name = "reviewq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "=0.13.5", default-features = false }
reviewq-app = { path = "../reviewq-app" }
reviewq-domain = { path = "../reviewq-domain" }
reviewq-providers = { path = "../reviewq-providers" }
reviewq-store = { path = "../reviewq-store" }
reviewq-transport = { path = "../reviewq-transport" }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

[lints]
workspace = true
