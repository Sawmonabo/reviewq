[package]
name = "reviewq-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "original-uri", "query", "tokio"] }
base64 = "0.22"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hmac = "0.13"
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
reviewq-app = { path = "../reviewq-app" }
reviewq-domain = { path = "../reviewq-domain" }
reviewq-protocol = { path = "../reviewq-protocol", features = ["schema"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6"
tokio = { version = "1.54.1", features = ["fs", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tower-http = { version = "=0.6.11", features = ["fs", "timeout"] }
url = "2.5"

[lints]
workspace = true
