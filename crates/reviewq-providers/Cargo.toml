[package]
name = "reviewq-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
httpdate = "1.0.3"
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
percent-encoding = "2.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rustix = { version = "1", features = ["fs", "process"] }
reviewq-app = { path = "../reviewq-app" }
reviewq-domain = { path = "../reviewq-domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shlex = "=2.0.1"
struson = "=0.8.0"
tempfile = "3.27"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
url = "2.5"
uuid = { version = "1.24", default-features = false }

[lints]
workspace = true
